# FallGuard Scoring Configuration v0.2
# All weights, thresholds, and time windows are here — never hard-coded in the engine.
# Edit via the admin UI (changes are versioned in the DB).

version: "0.2"

recalculate_interval_minutes: 15
score_change_alert_threshold: 15  # "Risk rising" flag if FLS rises >= this within 6h
score_change_alert_window_hours: 6

missing_data_penalty: 3  # Added when a key assessment is overdue

tier_bands:
  low_max: 24
  moderate_max: 49

# Fall Likelihood Score factors
fls:
  history:
    fall_this_admission: 25
    fall_past_6_months: 15

  age:
    age_65_74: 5
    age_75_84: 10
    age_85_plus: 15

  cognition:
    cam_positive: 15
    cam_window_hours: 24
    dementia: 8
    rass_nonzero: 5
    rass_window_hours: 12
    ciwa_threshold: 10
    ciwa_points: 10
    ciwa_window_hours: 12

  medications:
    frid_class_points: 4
    frid_cap: 16
    new_frid_points: 8
    new_frid_window_hours: 24
    prn_sedative_opioid_points: 8
    prn_decay_hours: 6
    anticholinergic_burden_threshold: 3
    anticholinergic_burden_points: 6

  hemodynamics:
    orthostatic_drop_points: 8
    orthostatic_window_hours: 48
    sbp_low_threshold: 90
    sbp_low_points: 5
    sbp_low_window_hours: 12
    glucose_low_threshold: 70
    glucose_low_points: 8
    glucose_window_hours: 24
    sodium_low_threshold: 130
    sodium_low_points: 5
    hgb_low_threshold: 8
    hgb_low_points: 5

  mobility:
    assistance_required: 8
    neuro_weakness: 6
    amputation: 6
    vestibular: 5

  toileting:
    incontinence: 6
    diuretic_points: 6
    diuretic_decay_hours: 6
    laxative_points: 6
    laxative_decay_hours: 8

  procedures:
    postop_day_0_2: 5
    nerve_block: 10
    epidural: 6
    tethers_threshold: 2
    tethers_points: 4

  sensory:
    vision_hearing: 3
    interpreter: 3

  sleep:
    overnight_interruptions_threshold: 2
    overnight_interruptions_points: 3
    overnight_start_hour: 23
    overnight_end_hour: 5

# Injury Severity Score factors
iss:
  bone:
    osteoporosis: 20
    osteopenia: 8
    prior_fragility_fracture: 20
    osteoporosis_therapy: 5
    chronic_glucocorticoids: 10
    bone_weakening_drug_per_class: 4
    bone_weakening_drug_cap: 8
    age_80_plus: 10
    female_sex: 5
    bmi_low_threshold: 18.5
    bmi_low_points: 10
    weight_loss_pct_threshold: 5
    weight_loss_days: 30
    weight_loss_points: 5
    albumin_low_threshold: 3.0
    albumin_low_points: 5
    ckd_stage_4_5: 8
    hyperparathyroidism: 5
    vitd_low_threshold: 20
    vitd_low_points: 4
    bone_metastases_myeloma: 15
    recent_joint_replacement: 10
    frailty_scale_threshold: 6
    frailty_scale_points: 10

  bleed:
    therapeutic_anticoagulant: 15
    inr_high_threshold: 3
    inr_high_points: 10
    dual_antiplatelet: 8
    platelets_low_threshold: 50
    platelets_low_points: 12
    prior_craniotomy: 20

  combined_minor_weight: 0.25  # ISS = max + 0.25 * min

# Placement optimizer
placement:
  base_move_penalty: 5
  delirious_move_penalty: 10
  overnight_move_penalty: 8   # 22:00–06:00
  recent_move_penalty: 8      # moved in last 24h

# Intervention effectiveness (placeholder — needs literature review)
interventions:
  sitter_fall_reduction: 0.60
  virtual_monitor_fall_reduction: 0.40
  bed_alarm_fall_reduction: 0.20
  low_bed_injury_reduction: 0.30
  hip_protector_injury_reduction: 0.50

# ROI defaults
roi:
  cost_per_injurious_fall: 14000  # USD, source: AHRQ

# ─────────────────────────────────────────────────────────────────────────────
# Nursing home setting (scoring mechanics v0.2, section 3).
# Bone points come from FRAiL (Berry et al., 2018); everything else is a starting
# heuristic to be calibrated on facility data.
nursing_home:
  levels:            # Fall Score bands (0-100)
    low_max: 24
    medium_max: 49

  mds_overdue_days: 92   # quarterly MDS; older → "Data gap" badge + missing_data_penalty

  risk_rising:
    points: 15
    window_days: 7

  fall:
    recent_fall:
      within_30d: 25
      within_180d: 15
    mobility:            # MDS GG walking + transfers, as observed behaviour
      steady: 0
      aid_or_supervision: 15
      needs_help_gets_up_alone: 25
      cannot_stand: 0    # bedbound residents rarely fall
    cognition:           # BIMS (MDS C) + behaviours (MDS E)
      intact: 0
      moderate_or_forgets_limits: 10
      severe_restless_or_wanders: 15
    fall_risk_med_points: [0, 5, 10, 15]   # by count of classes: 0 / 1 / 2 / 3+
    # Med class → fall-risk class group (several drug classes share one group)
    fall_risk_classes:
      antipsychotic: antipsychotics
      benzodiazepine: sedatives
      sleep: sedatives
      opioid: opioids
      antidepressant: antidepressants
      ssri: antidepressants
      anticonvulsant: anticonvulsants
      antihypertensive: bp_and_diuretics
      diuretic: bp_and_diuretics
    recent_change:
      window_days: 7
      new_or_increased_drug: 10
      acute_illness: 10  # new infection, antibiotic, fever or hospital return
      cap: 20
    bathroom_urgency: 10
    dizziness_orthostatic_vision: 5

  bone:                  # FRAiL-Points (injury mode excludes previous fall + wandering)
    mode: injury         # injury | full
    female: 4
    walking:
      independent: 15
      limited: 11
      extensive: 8
      total: 0
    transfers:
      independent: 10
      limited: 9
      extensive: 4
      total: 0
    adl:
      independent: 10
      extensive_1: 10
      extensive_2: 7
      dependent: 4
      total: 0
    bladder:
      continent: 6
      frequent: 3
      total: 0
    bmi_bands:           # [minimum BMI, points], checked top-down
      - [30, 0]
      - [26, 3]
      - [22, 7]
      - [18.5, 10]
      - [0, 14]
    cognition:
      intact: 0
      moderate: 1
      severe: 3
    diabetes_female: 2
    drug_classes:
      benzodiazepine: 2
      ssri: 2
      cholinesterase_inhibitor: 2
      alpha_blocker: -2
    easily_distracted: 1
    pressure_ulcer: -3
    osteoarthritis: -1
    previous_fall_full_mode: 5
    wandering_full_mode: 6
    percentile_bands:    # facility percentile of bone points
      high_min: 80       # top 20%
      medium_min: 50     # next 30%

  bleed:
    recent_fall_days: 30

  care_levels:
    1:
      name: Routine
      actions: Normal rounds
    2:
      name: Watch
      actions: Call light, walker and glasses always in reach
    3:
      name: Careful
      actions: Help to the bathroom after meals and at bedtime; non-slip socks
    4:
      name: High Alert
      actions: Level 3 plus hourly checks overnight; room near the station if possible; hip protectors if Injury is High
    5:
      name: Top Priority
      actions: Level 4 plus named at every shift handoff; flag for nurse or pharmacist medication review; consider a sensor or camera per the care plan (document the reason, since alarms can count as restraints under CMS F604)
